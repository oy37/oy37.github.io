<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 1 — Oscar Yang</title>
  <meta name="description" content="Project 1 portfolio page for Oscar Yang." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap project-page">
    <a class="back-link" href="index.html">← Back to portfolio</a>

    <header class="project-header">
      <p class="eyebrow">Project 1</p>
      <h1>Sustainability Awareness Poster Campaign</h1>
      <p class="project-summary">A concept-driven awareness campaign designed to translate a broad sustainability message into a more memorable and visually compelling brand story for a student creative project.</p>
    </header>

    <main class="project-gallery" aria-label="Project images">

      <figure class="project-figure">
        <img class="project-image" src="Breath.png" alt="Breath poster design" />
        <figcaption><strong>Breath</strong> — a tight, close-up crop where the wordmark becomes the skyline, pressing down on a blurred street below.</figcaption>
      </figure>

      <figure class="project-figure">
        <img class="project-image" src="Cluttered.png" alt="Cluttered poster design" />
        <figcaption><strong>Cluttered</strong> — a cramped, over-stuffed room in a hot, oversaturated palette; the blackletter type runs the length of the frame like a shelf label.</figcaption>
      </figure>

      <!-- EDIT: Caged.png — write your own one-line caption for this one, I haven't seen the image -->
      <figure class="project-figure">
        <img class="project-image" src="Caged.png" alt="Caged poster design" />
        <figcaption><strong>Caged</strong> — a dense crowd blurred into anonymity, each face indistinct from the next; the serif type sits low and still, like a plaque no one looks down to read.</figcaption>
      </figure>

      <figure class="project-figure">
        <img class="project-image" src="Invisible.png" alt="Invisible poster design" />
        <figcaption><strong>Invisible</strong> — grain and scratches age the photograph, while the spaced serif type reads almost like an engraved plaque: pollution made to look historic, and therefore easy to ignore.</figcaption>
      </figure>

      <figure class="project-figure">
        <img class="project-image project-image-final" src="Breathe1.png" alt="Final Breath poster design" />
        <figcaption><strong>Final poster</strong> — the halftone chimney and wordmark are pulled together into the finished piece, condensed into one image that reads clearly at a glance.</figcaption>
      </figure>

    </main>
  </div>

</body>
</html>
